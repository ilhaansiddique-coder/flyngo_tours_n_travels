name: Backend — Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/flyngo-backend

jobs:
  build-check:
    name: Build (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm install --no-audit --prefer-offline

      - name: Prisma generate
        run: npx prisma generate

      - name: Build (type-check)
        run: npm run build

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm run test -- --passWithNoTests

  build-and-push:
    name: Build & Push Image
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-v2
          cache-to: type=gha,mode=max,scope=backend-v2
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            GIT_COMMIT_AUTHOR=${{ github.event.head_commit.author.name }}
            GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_REPO=${{ github.repository }}

      - name: Trigger Coolify deploy
        if: vars.COOLIFY_DEPLOY_WEBHOOK != ''
        env:
          WEBHOOK_URL: ${{ vars.COOLIFY_DEPLOY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deploy at $WEBHOOK_URL"
          HTTP_CODE=$(curl -sS -o /tmp/coolify-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            --max-time 30 \
            "$WEBHOOK_URL" || echo "000")
          echo "Coolify responded: HTTP $HTTP_CODE"
          if [ -s /tmp/coolify-response.txt ]; then
            echo "Response body:"
            cat /tmp/coolify-response.txt
          fi
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Deploy triggered"
            exit 0
          fi
          echo "::warning::Coolify webhook returned HTTP $HTTP_CODE — image is pushed to ghcr.io, trigger a manual redeploy from Coolify UI if needed"
          exit 0
