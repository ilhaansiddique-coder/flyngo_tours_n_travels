name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — unit, PostgreSQL integration and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RELEASE_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SESSION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flyngo_sessions_test?schema=public
      PRIVATE_MEDIA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flyngo_private_media_test?schema=public
      ACCOUNT_DELETION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flyngo_account_deletion_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flyngo_sessions_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --prefer-offline
      - run: npm audit --audit-level=high
      - name: Verify glob dependency security and compatibility
        run: node ../scripts/verify-glob-security.cjs
      - name: Verify deployment request contract
        run: node --test ../scripts/trigger-verified-deploy.test.cjs
      - name: Verify routine startup preserves bootstrap data
        run: node --test ../scripts/backend-startup.test.cjs
      - name: Migrate disposable PostgreSQL databases
        run: node scripts/prepare-release-tests.cjs
      - name: Lint (read-only)
        run: npm run lint -- --quiet
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - name: Required database integration tests (missing URLs fail)
        run: npm run test:integration
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: verified-backend-${{ github.sha }}
          path: backend/dist
          if-no-files-found: error

  browser:
    name: Frontend — unit, production build and Chromium/Firefox integration
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RELEASE_TEST_DATABASE_BASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flyngo_browser_test?schema=public
      BACKEND_URL: http://127.0.0.1:4107
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3108
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --prefer-offline
        working-directory: backend
      - run: npm ci --no-audit --prefer-offline
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Verify glob dependency security and compatibility
        run: node ../scripts/verify-glob-security.cjs
        working-directory: frontend
      - run: npm run lint -- --quiet
        working-directory: frontend
      - run: npm test -- --runInBand
        working-directory: frontend
      - name: Migrate and seed disposable browser database
        run: node scripts/prepare-release-tests.cjs --browser-only
        working-directory: backend
      - uses: actions/download-artifact@v4
        with:
          name: verified-backend-${{ github.sha }}
          path: backend/dist
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - name: Browser tests against production builds and real PostgreSQL API
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  release-verification:
    name: Release verification
    needs: [backend, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BACKEND_RESULT" = success && test "$BROWSER_RESULT" = success

  publish-backend:
    needs: release-verification
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  publish-frontend:
    needs: release-verification
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  deploy:
    name: Deployment handoff
    needs: [publish-backend, publish-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trigger Coolify only after both images are published
        if: vars.COOLIFY_DEPLOY_MODE != 'manual'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK || vars.COOLIFY_DEPLOY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: node scripts/trigger-verified-deploy.cjs
      - name: Record manual deployment handoff
        if: vars.COOLIFY_DEPLOY_MODE == 'manual'
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Images verified and published — manual deployment required'
            echo "Commit: $VERIFIED_SHA"
            echo 'Automatic Coolify requests are disabled by COOLIFY_DEPLOY_MODE=manual.'
            echo 'Open the existing Flyngo resource in Coolify and deploy the published images.'
            echo 'This workflow has not deployed or verified the live rollout.'
          } >> "$GITHUB_STEP_SUMMARY"
