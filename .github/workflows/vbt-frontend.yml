name: VBT Frontend — Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'VBT/frontend/**'
      - '.github/workflows/vbt-frontend.yml'
  workflow_dispatch:

concurrency:
  group: vbt-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vbt-frontend

jobs:
  build-check:
    name: Build (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VBT/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: VBT/frontend/package-lock.json

      - run: npm install --no-audit --prefer-offline

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: "http://backend:4000"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'http://placeholder.invalid' }}
          NEXT_PUBLIC_VBT_BASE_PATH: /VBT
          NEXT_PUBLIC_VBT_USE_BASEPATH: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Lint
        run: npm run lint || true

  build-and-push:
    name: Build & Push Image
    needs: build-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./VBT/frontend
          file: ./VBT/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vbt-frontend
          cache-to: type=gha,mode=max,scope=vbt-frontend
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_VBT_BASE_PATH=/VBT
            NEXT_PUBLIC_VBT_USE_BASEPATH=true

      - name: Trigger Coolify deploy
        if: vars.COOLIFY_VBT_DEPLOY_WEBHOOK != ''
        env:
          WEBHOOK_URL: ${{ vars.COOLIFY_VBT_DEPLOY_WEBHOOK }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deploy at $WEBHOOK_URL"
          HTTP_CODE=$(curl -sS -o /tmp/coolify-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            --max-time 30 \
            "$WEBHOOK_URL" || echo "000")
          echo "Coolify responded: HTTP $HTTP_CODE"
          if [ -s /tmp/coolify-response.txt ]; then
            echo "Response body:"
            cat /tmp/coolify-response.txt
          fi
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Deploy triggered"
            exit 0
          fi
          echo "::warning::Coolify webhook returned HTTP $HTTP_CODE — image is pushed to ghcr.io, trigger a manual redeploy from Coolify UI if needed"
          exit 0