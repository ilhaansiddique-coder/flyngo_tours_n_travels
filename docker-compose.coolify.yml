# Flyngo — Coolify runtime stack
#
# Images are built and pushed to ghcr.io by GitHub Actions on every push to main.
# Coolify pulls them; no build happens on the server. Stateless services only —
# Postgres, Redis, Meilisearch are separate Coolify Services with hostnames:
#   flyngo-db, flyngo-redis, flyngo-meili

services:
  backend:
    image: ghcr.io/ilhaansiddique-coder/flyngo-backend:main
    container_name: flyngo-backend
    restart: always
    environment:
      NODE_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_URL: ${ADMIN_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BKASH_API_KEY: ${BKASH_API_KEY:-}
      BKASH_SECRET_KEY: ${BKASH_SECRET_KEY:-}
      BKASH_USERNAME: ${BKASH_USERNAME:-}
      BKASH_PASSWORD: ${BKASH_PASSWORD:-}
      BKASH_BASE_URL: ${BKASH_BASE_URL:-https://tokenized.sandbox.bka.sh/v1.2.0-beta}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID:-}
      NAGAD_SECRET_KEY: ${NAGAD_SECRET_KEY:-}
      NAGAD_BASE_URL: ${NAGAD_BASE_URL:-}
      SSLC_STORE_ID: ${SSLC_STORE_ID:-}
      SSLC_STORE_PASSWORD: ${SSLC_STORE_PASSWORD:-}
      SSLC_BASE_URL: ${SSLC_BASE_URL:-https://sandbox.sslcommerz.com}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@flyngo.world}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const h=require(\"http\");h.get(\"http://localhost:4000/api/v1/health\",r=>{let d=\"\";r.on(\"data\",c=>d+=c);r.on(\"end\",()=>{try{const j=JSON.parse(d);process.exit(j.status===\"ok\"?0:1)}catch{process.exit(1)}})}).on(\"error\",()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/ilhaansiddique-coder/flyngo-frontend:main
    container_name: flyngo-frontend
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const h=require(\"http\");h.get(\"http://localhost:3000/\",r=>{process.exit(r.statusCode===200?0:1)}).on(\"error\",()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
